[workspace]
resolver = "2"
members = [
    "crates/compass-core",
    "crates/compass-tap",
    "crates/compass-mcp",
    "crates/compass-x402",
    "crates/compass-schema",
    "crates/compass-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# HTTP
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Ethereum / EIP-712
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-sol-types = "0.8"
k256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"

# Errors + logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Workspace crates
compass-core   = { path = "crates/compass-core" }
compass-tap    = { path = "crates/compass-tap" }
compass-mcp    = { path = "crates/compass-mcp" }
compass-x402   = { path = "crates/compass-x402" }
compass-schema = { path = "crates/compass-schema" }
